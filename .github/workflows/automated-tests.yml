name: Automated checks

on:
  push:
    branches:
      - refactor-1.7
      - automated-tests-phase-1-2
  pull_request:
    branches:
      - refactor-1.7

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Build mod
        run: dotnet build Reunion.sln --configuration Debug

      - name: Run unit tests
        run: dotnet test Tests/Reunion.Tests.csproj --configuration Debug

      - name: Validate XML files
        run: python scripts/validate_xml.py
